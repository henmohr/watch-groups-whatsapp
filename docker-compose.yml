services:
  watcher:
    build:
      context: .
    networks:
      - nextcloud
    environment:
      DATA_DIR: ${DATA_DIR:-/app/data}
      AUTH_DIR: ${AUTH_DIR:-/app/data/auth}
      SUMMARY_DIR: ${SUMMARY_DIR:-/app/data/summaries}
      LOG_FILE: ${LOG_FILE:-/app/data/conversas.jsonl}
      SUMMARY_FILE: ${SUMMARY_FILE:-/app/data/conhecimento.md}
      GROUP_IDS: ${GROUP_IDS:-}
      GROUP_NAMES: ${GROUP_NAMES:-}
      GROUP_ID: ${GROUP_ID:-}
      GROUP_NAME: ${GROUP_NAME:-}
      INCLUDE_SELF: ${INCLUDE_SELF:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      SUMMARY_INTERVAL_SECONDS: ${SUMMARY_INTERVAL_SECONDS:-300}
      SUMMARY_MIN_MESSAGES: ${SUMMARY_MIN_MESSAGES:-5}
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-1}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
    volumes:
      - ./data:/app/data
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  nextcloud:
    external: true
    name: ${NEXTCLOUD_NETWORK:-internal}
