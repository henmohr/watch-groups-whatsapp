name: Publish ExApp image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ExApp image
        uses: docker/build-push-action@v6
        with:
          context: ./nextcloud-exapp
          file: ./nextcloud-exapp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/watchgroups:latest
            ghcr.io/${{ github.repository_owner }}/watchgroups:${{ github.sha }}
